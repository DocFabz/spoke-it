name: Deploy Spoke It

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Injecter le hash d'index.html dans sw.js
        run: |
          HASH=$(sha256sum index.html | cut -c1-8)
          sed -i "s/const CACHE = 'spoke-it-v[^']*'/const CACHE = 'spoke-it-$HASH'/" sw.js

      - name: Commit sw.js mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --staged --quiet || git commit -m "chore: mise à jour cache sw.js [skip ci]"
          git push
