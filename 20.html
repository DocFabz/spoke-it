<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test reco : vingt / trente</title>
<style>
  :root { color-scheme: light dark; }
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 12px; max-width: 900px; margin-inline: auto; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #888; background: #eee; color: #000; cursor: pointer; }
  button.on { background: #c0392b; color: #fff; border-color: #c0392b; }
  select, label { font: inherit; }
  #log { font: 12px/1.35 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; border: 1px solid #8884; border-radius: 6px; padding: 8px; min-height: 200px; max-height: 70vh; overflow: auto; }
  .f { color: #1a7f37; font-weight: 600; }
  .i { opacity: .7; }
  .e { color: #c0392b; }
  .n { color: #8250df; font-weight: 600; }
  .hint { opacity: .75; margin: 6px 0 10px; }
</style>
</head>
<body>
<h1>Test reco : « vingt » / « trente » isolés</h1>
<p class="hint">Démarre, dis « vingt », attends 2 s, dis « trente », attends, puis essaye « zéro vingt », « trente virgule zéro ». Tout ce que le moteur renvoie s'affiche brut, hypothèses comprises. Bouton Copier pour me coller le résultat.</p>
<div class="bar">
  <button id="go">Démarrer</button>
  <label>Langue <select id="lang">
    <option value="fr-FR" selected>fr-FR</option><option value="fr-CH">fr-CH</option><option value="fr-BE">fr-BE</option><option value="en-US">en-US</option>
  </select></label>
  <label><input type="checkbox" id="cont" checked> continuous</label>
  <label><input type="checkbox" id="inter" checked> interimResults</label>
  <label>maxAlternatives <input type="number" id="alts" value="5" min="1" max="10" style="width:3.5em"></label>
  <button id="copy">Copier</button>
  <button id="clear">Effacer</button>
</div>
<div id="log"></div>
<script>
var log = document.getElementById('log'), r = null, t0 = 0, active = false;
function now() { return ((performance.now() - t0) / 1000).toFixed(2).padStart(6) + 's'; }
function line(cls, txt) {
  var d = document.createElement('div'); d.className = cls; d.textContent = now() + '  ' + txt;
  log.appendChild(d); log.scrollTop = log.scrollHeight;
}
line('i', 'UA: ' + navigator.userAgent);
line('i', 'SpeechRecognition: ' + (('SpeechRecognition' in window) ? 'natif' : ('webkitSpeechRecognition' in window) ? 'webkit' : 'ABSENT'));

function start() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { line('e', 'Pas de SpeechRecognition'); return; }
  r = new SR();
  r.lang = document.getElementById('lang').value;
  r.continuous = document.getElementById('cont').checked;
  r.interimResults = document.getElementById('inter').checked;
  r.maxAlternatives = parseInt(document.getElementById('alts').value, 10) || 1;
  t0 = performance.now();
  line('i', '--- start lang=' + r.lang + ' continuous=' + r.continuous + ' interim=' + r.interimResults + ' alts=' + r.maxAlternatives);
  ['audiostart','soundstart','speechstart','speechend','soundend','audioend','nomatch'].forEach(function(ev) {
    r.addEventListener(ev, function() { line('i', 'event ' + ev); });
  });
  r.onstart = function() { line('i', 'event start'); };
  r.onerror = function(e) { line('e', 'error ' + e.error + (e.message ? ' : ' + e.message : '')); };
  r.onend = function() {
    line('i', 'event end');
    if (active) { setTimeout(function() { if (active) { try { r.start(); line('i', 'restart'); } catch(x) { line('e', 'restart KO ' + x.message); } } }, 80); }
  };
  r.onresult = function(e) {
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var res = e.results[i], fin = res.isFinal;
      var parts = [];
      for (var k = 0; k < res.length; k++) {
        var a = res[k];
        parts.push('"' + a.transcript + '"' + (typeof a.confidence === 'number' ? ' (' + a.confidence.toFixed(2) + ')' : ''));
      }
      var hasDigit = /\d/.test(res[0].transcript);
      line(fin ? 'f' : 'i', (fin ? 'FINAL  ' : 'interim') + ' #' + i + ' ' + parts.join(' | '));
      if (fin && !hasDigit) line('n', '        ^ final SANS chiffre : Spokeit renverrait null' +
        (/vingt|trente|vin|va|vain|vint/.test(res[0].transcript.toLowerCase()) ? ' sauf via le dictionnaire de mots' : ' (silence)'));
    }
  };
  try { r.start(); active = true; } catch(x) { line('e', 'start KO ' + x.message); }
  document.getElementById('go').textContent = 'Arrêter'; document.getElementById('go').className = 'on';
}
function stop() {
  active = false;
  if (r) { try { r.abort(); } catch(x) {} r = null; }
  line('i', '--- stop');
  document.getElementById('go').textContent = 'Démarrer'; document.getElementById('go').className = '';
}
document.getElementById('go').onclick = function() { active ? stop() : start(); };
document.getElementById('clear').onclick = function() { log.textContent = ''; };
document.getElementById('copy').onclick = function() {
  var txt = log.innerText;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function() { line('i', '(copié)'); }, function() { fallback(); });
  else fallback();
  function fallback() { var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); line('i', '(copié)'); } catch(x) {} ta.remove(); }
};
</script>
</body>
</html>
